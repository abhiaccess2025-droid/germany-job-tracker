name: Bot 1 - NRW Job Scanner
# Manual execution requested 2026-11-01; schedule and scanner configuration unchanged.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tracker_v2.py
      - job_scoring.py
      - tracker.py
      - config.json
      - test_bot1.py
      - .github/workflows/weekly-jobs.yml
  schedule:
    - cron: '0 2 * * 6'
      timezone: 'Europe/Berlin'

permissions:
  contents: read

concurrency:
  group: nrw-job-scanner
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test scanner, scoring and deduplication
        run: python -m unittest discover -p 'test*.py' -v
      - name: Scan sources and append ranked job matches
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python tracker_v2.py
